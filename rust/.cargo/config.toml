# ビルド設定。最適化フラグはターゲットに依らず両実装へ等しく適用される
# （モードごとの条件分岐は一切無い。12.11.2節「比較の公平性に関する注意」）。
#
# WSL2 側には C コンパイラが無く sudo も使えないため、musl ターゲット＋rust-lld の
# self-contained リンクでビルドする。Jetson (aarch64) には gcc があるので通常の
# gnu ターゲットでビルドする（どちらも rustc の最適化設定は同じ）。

[target.x86_64-unknown-linux-musl]
rustflags = ["-Clinker-flavor=ld.lld", "-Clink-self-contained=yes", "-Ctarget-cpu=native"]

[target.aarch64-unknown-linux-gnu]
rustflags = ["-Ctarget-cpu=native"]
